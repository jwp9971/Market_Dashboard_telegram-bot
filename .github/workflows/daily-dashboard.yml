name: Daily Market Dashboard

on:
  schedule:
    - cron: '0 23 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  run-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # main.py exits 0 = OK, 1 = failed, 2 = delivered but degraded.
        # The summary makes the difference visible without opening the logs.
        run: |
          set +e
          python src/main.py
          code=$?
          set -e
          case "$code" in
            0) echo "### Report delivered (OK)" >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "### Report delivered but DEGRADED - check the log for warnings" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "### Report FAILED (exit $code)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          exit $code
