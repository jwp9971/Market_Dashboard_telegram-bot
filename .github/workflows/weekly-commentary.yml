name: Weekly Commentary

# One report a week, three chances to send it. GitHub's scheduler can drop a
# slot outright (0 3 * * 6 on 2026-09-26 never ran), so the primary slot has two
# backups. Every scheduled run first checks (src/weekly_guard.py) whether an
# earlier run already delivered the week that closed last Friday, and skips if
# so; the Run button always runs.
#
# Monday morning KST (moved from Saturday on 2026-10-03). The primary is
# Sunday 23:17 UTC = Monday 08:17 KST, the hour band the daily bot's cron
# (0 23 * * 0-4) used and which fired 7/7 times on this repo. By then every
# Friday source is final (Massive end-of-day bars, Cboe VIX). Rates and credit
# still show Thursday: FRED / Economy API run a business day late, and
# Friday's values only appear on Monday US time. Minute 17, not 0: the
# scheduler is busiest on the hour. Runs can still start late (about 2 h has
# been typical here).
#
# Massive's terms forbid publishing its data. The repository is private, but
# its logs are still visible to anyone it is shared with: no DRY_RUN here, no
# artifacts, no actions/cache. The job fetches fresh each run and logs only
# statuses and counts.
on:
  schedule:
    - cron: '17 23 * * 0'   # primary: Monday 08:17 KST (Sunday 23:17 UTC)
    - cron: '17 3 * * 1'    # backup: Monday 12:17 KST
    - cron: '17 9 * * 1'    # backup: Monday 18:17 KST
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read   # the guard reads this workflow's earlier runs

# A slot that fires while another run is going waits for it, then its guard
# sees that run's result.
concurrency:
  group: weekly-commentary
  cancel-in-progress: false

jobs:
  run-weekly:
    # The Run button lets you pick any branch; only main posts to the chat.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Scheduled slots only. If the check itself breaks, the report still runs.
      - name: Check whether this week's report already went out
        id: guard
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/weekly_guard.py

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # This step fails only when nothing was delivered (exit 1), which is
      # what the guard reads. A degraded report fails the next step instead,
      # so the run is still red but the week counts as sent.
      - name: Run weekly commentary
        id: weekly
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          # Print each log line as it happens, not all at exit: a run killed
          # by the timeout would otherwise leave an empty log.
          PYTHONUNBUFFERED: '1'
          # Repository variables (Settings > Secrets and variables > Actions >
          # Variables). Empty means the code defaults: claude-sonnet-5 / high.
          WEEKLY_ANTHROPIC_MODEL: ${{ vars.WEEKLY_ANTHROPIC_MODEL }}
          WEEKLY_ANTHROPIC_EFFORT: ${{ vars.WEEKLY_ANTHROPIC_EFFORT }}
        # weekly_main.py exits 0 = OK, 1 = failed, 2 = delivered but degraded.
        run: |
          set +e
          python src/weekly_main.py
          code=$?
          set -e
          case "$code" in
            0) echo "### Weekly report delivered (OK)" >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "### Weekly report delivered but DEGRADED - check the log for warnings" >> "$GITHUB_STEP_SUMMARY"
               echo "degraded=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "### Weekly report FAILED (exit $code)" >> "$GITHUB_STEP_SUMMARY"
               exit "$code" ;;
          esac

      - name: Flag degraded report
        if: steps.weekly.outputs.degraded == 'true'
        run: |
          echo "Delivered, but degraded (exit 2): see the warnings in the step above."
          exit 2

      - name: Note skipped slot
        if: steps.guard.outputs.skip == 'true'
        run: echo "### This week's report already went out - slot skipped" >> "$GITHUB_STEP_SUMMARY"
